{% extends "frontend/base.html" %}

{% block title %}Applications — Startly{% endblock %}

{% block content %}

<section class="dashboard-header">

    <div>
        <div class="eyebrow">STARTUP APPLICATIONS</div>
        <h1>People who want to join your team.</h1>
        <p>
            Review applications for all jobs belonging to this startup.
        </p>
    </div>

</section>


<section class="section compact">

    <div id="applications" class="application-list">

        <div class="loading">
            Loading applications…
        </div>

    </div>

</section>

{% endblock %}


{% block scripts %}

<script>

async function loadApplications() {

    const applicationsBox =
        document.getElementById("applications");

    try {

        const response =
            await fetch("/api/startups/my-applications/");

        if (!response.ok) {
            throw new Error("Could not load applications");
        }

        const applications =
            await response.json();

        if (!applications.length) {

            applicationsBox.innerHTML =
                emptyBox("No applications yet.");

            return;
        }

        applicationsBox.innerHTML =
            applications.map(application => `

                <div class="card">

                    <div class="eyebrow">
                        ${escapeHtml(
                            application.job_title
                        )}
                    </div>

                    <h3>
                        ${escapeHtml(
                            application.student_name
                        )}
                    </h3>

                    <p>
                        ${escapeHtml(
                            application.student_college
                        )}
                        ·
                        ${escapeHtml(
                            application.student_course
                        )}
                    </p>

                    ${
                        application.cover_message
                            ? `
                                <p>
                                    ${escapeHtml(
                                        application.cover_message
                                    )}
                                </p>
                              `
                            : ""
                    }

                    <div class="meta-row">

                        <span class="status">
                            ${escapeHtml(
                                application.status
                            )}
                        </span>

                    </div>


                    ${
                        application.status === "PENDING"
                            ? `
                                <div class="dashboard-actions">

                                    <button
                                        class="btn btn-primary"
                                        onclick="updateApplication(
                                            ${application.id},
                                            'ACCEPTED'
                                        )"
                                    >
                                        Accept
                                    </button>

                                    <button
                                        class="btn btn-secondary"
                                        onclick="updateApplication(
                                            ${application.id},
                                            'REJECTED'
                                        )"
                                    >
                                        Reject
                                    </button>

                                </div>
                              `
                            : ""
                    }

                </div>

            `).join("");

    } catch (error) {

        applicationsBox.innerHTML =
            errorBox(
                "Could not load applications."
            );

    }

}


async function updateApplication(
    applicationId,
    newStatus
) {

    try {

        const response =
            await fetch(
                `/api/startups/applications/${applicationId}/status/`,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        status: newStatus
                    })
                }
            );

        if (!response.ok) {

            const data =
                await response.json();

            alert(
                data.error ||
                "Could not update application."
            );

            return;
        }

        await loadApplications();

    } catch (error) {

        alert("Could not update application.");

    }

}


document.addEventListener(
    "DOMContentLoaded",
    loadApplications
);

</script>

{% endblock %}

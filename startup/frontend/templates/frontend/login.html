{% extends "frontend/base.html" %}

{% block title %}Login — Startly{% endblock %}

{% block content %}

<style>
    .auth-page {
        min-height: calc(100vh - 130px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 24px;
    }

    .auth-card {
        width: 100%;
        max-width: 460px;
        padding: 42px;
    }

    .auth-card h1 {
        font-size: 42px;
        line-height: 1.05;
        letter-spacing: -0.045em;
        margin-bottom: 12px;
    }

    .auth-subtitle {
        color: #667085;
        font-size: 15px;
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        color: #344054;
        margin-bottom: 7px;
    }

    .form-group input {
        width: 100%;
        height: 46px;
        border: 1px solid #d9dce3;
        background: white;
        border-radius: 9px;
        padding: 11px 12px;
        font: inherit;
        color: #111827;
        outline: none;
    }

    .form-group input:focus {
        border-color: #635bff;
        box-shadow: 0 0 0 3px rgba(99, 91, 255, 0.1);
    }

    .auth-button {
        width: 100%;
        height: 46px;
        margin-top: 4px;
    }

    .auth-footer {
        margin-top: 24px;
        text-align: center;
        color: #667085;
        font-size: 14px;
    }

    .auth-footer a {
        color: #635bff;
        font-weight: 700;
        text-decoration: none;
    }

    .auth-footer a:hover {
        color: #5148e8;
        text-decoration: underline;
    }

    .error-message {
        padding: 12px 14px;
        margin-bottom: 22px;
        border-radius: 9px;
        background: #fff0ee;
        color: #b42318;
        border: 1px solid #ffd0ca;
        font-size: 13px;
    }

    @media (max-width: 800px) {
        .auth-page {
            padding: 40px 18px;
        }

        .auth-card {
            padding: 30px 24px;
        }

        .auth-card h1 {
            font-size: 34px;
        }
    }
</style>

<section class="auth-page">

    <div class="auth-card card">

        <div class="eyebrow">WELCOME BACK</div>

        <h1>Log in to Startly.</h1>

        <p class="auth-subtitle">
            Sign in to continue to your Startly account.
        </p>

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn btn-primary auth-button"
            >
                Log in
            </button>

        </form>

        <p class="auth-footer">
            Don't have an account?
            <a href="/register/">Create one</a>
        </p>

    </div>

</section>

{% endblock %}

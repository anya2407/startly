{% extends "frontend/base.html" %}

{% block title %}Startup Dashboard — Startly{% endblock %}

{% block content %}

<section class="dashboard-header">

    <div>
        <div class="eyebrow">STARTUP DASHBOARD</div>
        <h1>Manage your hiring.</h1>
    </div>

</section>

<section class="section compact">

    <div class="dashboard-actions">

        <a
            id="applications-link"
            class="btn btn-secondary"
            href="#"
        >
            View applications →
        </a>

    </div>

</section>

<section class="section compact">

    <div id="startup-summary" class="card">

        <div class="loading">
            Loading your startup...
        </div>

    </div>

</section>

{% endblock %}

{% block scripts %}

<script>

async function loadStartupDashboard() {

    const summaryBox =
        document.getElementById("startup-summary");

    try {

        const response =
            await fetch("/api/startups/me/");

        if (!response.ok) {
            throw new Error("Could not load startup");
        }

        const startup =
            await response.json();

        document.getElementById(
            "applications-link"
        ).href =
            `/startup/${startup.id}/applications/`;

        summaryBox.innerHTML = `

            <div class="eyebrow">
                ${escapeHtml(
                    startup.industry || "STARTUP"
                )}
            </div>

            <h2>
                ${escapeHtml(startup.name)}
            </h2>

            <p>
                ${escapeHtml(startup.description)}
            </p>

            <div class="meta-row">

                <span>
                    📍
                    ${escapeHtml(
                        startup.location ||
                        "Location not specified"
                    )}
                </span>

                <span
                    class="status ${
                        startup.is_hiring
                            ? "status-open"
                            : "status-muted"
                    }"
                >
                    ${
                        startup.is_hiring
                            ? "Hiring"
                            : "Not hiring"
                    }
                </span>

            </div>

        `;

    } catch (error) {

        summaryBox.innerHTML =
            errorBox(
                "Could not load your startup."
            );

    }
}

document.addEventListener(
    "DOMContentLoaded",
    loadStartupDashboard
);

</script>

{% endblock %}
